name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  bridge:
    # No DewieOps checkout here: bridge/tests/conftest.py skips the tests that
    # need dewie_brain (with the reason) and runs everything else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # requirements.txt installs DewieOps from ../../DewieOps; there is no such
        # checkout in this job, so install everything except that line.
        # httpx backs FastAPI's TestClient; DewieOps pulls it in on the office box.
        run: |
          grep -v '^-e ' bridge/requirements.txt > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" pytest httpx
      - name: pytest
        # The tests import the bridge modules (main, parser, ...) from bridge/.
        working-directory: bridge
        run: python -m pytest tests -q -rs

  bridge-with-dewieops:
    # Disabled until the DEWIEOPS_READ_TOKEN repository secret exists: a
    # fine-grained token with read-only Contents access to lanAI-B/DewieOps.
    # Remove the `if: false` line once it is added.
    if: false
    runs-on: ubuntu-latest
    steps:
      # Both repos side by side under $GITHUB_WORKSPACE, as on the office box:
      # conftest finds the sibling ../DewieOps and requirements.txt installs it.
      - uses: actions/checkout@v4
        with:
          path: dewie-desk
      - uses: actions/checkout@v4
        with:
          repository: lanAI-B/DewieOps
          token: ${{ secrets.DEWIEOPS_READ_TOKEN }}
          path: DewieOps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # pip resolves the `-e ../../DewieOps` line against the working directory.
        working-directory: dewie-desk/bridge
        run: python -m pip install -r requirements.txt pytest httpx
      - name: pytest
        working-directory: dewie-desk/bridge
        env:
          REQUIRE_DEWIEOPS: "1"
        run: python -m pytest tests -q
